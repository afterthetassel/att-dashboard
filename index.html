<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>After the Tassel | Student Portal</title>
<style>
  :root {
    --primary: #5b3fa0;
    --secondary: #f5f7fa;
    --text-dark: #2d2440;
    --text-gray: #8a8398;
    --pending: #e6a817;
    --pending-bg: #fef6e6;
    --approved: #2e9e5b;
    --approved-bg: #e9f8ef;
    --notstarted: #9b95a8;
    --notstarted-bg: #f0eef4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #f5f3fb 0%, #eeeaf7 100%);
    min-height: 100vh;
    color: var(--text-dark);
  }

  /* ---------- LOGIN VIEW ---------- */
  #loginView {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(91, 63, 160, 0.15);
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .login-card img.logo {
    max-width: 260px;
    width: 100%;
    margin-bottom: 28px;
  }
  .login-card h2 {
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--text-dark);
    text-transform: uppercase;
    margin-bottom: 4px;
    text-align: left;
  }
  .login-card .field-subtext {
    font-size: 13px;
    color: var(--text-gray);
    text-align: left;
    margin-bottom: 10px;
  }
  .login-card input {
    width: 100%;
    padding: 16px 18px;
    font-size: 20px;
    letter-spacing: 0.15em;
    text-align: center;
    text-transform: uppercase;
    border: 2px solid #e3ddf0;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 18px;
  }
  .login-card input:focus { border-color: var(--primary); }
  .login-card button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .login-card button:hover { opacity: 0.9; }
  .login-card button:disabled { opacity: 0.6; cursor: default; }
  .error-msg {
    color: #c0392b;
    background: #fdecea;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }
  .lost-code-box {
    margin-top: 22px;
    background: var(--secondary);
    border-radius: 12px;
    padding: 16px 18px;
    text-align: left;
    font-size: 13px;
    color: var(--text-dark);
    line-height: 1.5;
  }
  .lost-code-box strong { color: var(--primary); }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- DASHBOARD VIEW ---------- */
  #dashboardView { display: none; min-height: 100vh; padding: 32px 20px 60px; }
  .dash-wrap { max-width: 720px; margin: 0 auto; }
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .dash-header img { height: 44px; }
  .dash-header .greeting { text-align: right; }
  .dash-header .greeting h1 { font-size: 20px; color: var(--text-dark); }
  .dash-header .greeting p { font-size: 13px; color: var(--text-gray); }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 20px;
    box-shadow: 0 6px 24px rgba(91,63,160,0.08);
  }
  .card h3 {
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-gray);
    margin-bottom: 14px;
  }

  .points-value { font-size: 44px; font-weight: 800; color: var(--primary); }
  .points-unit { font-size: 15px; color: var(--text-gray); margin-left: 6px; }

  .progress-bar-track {
    width: 100%; height: 12px;
    background: var(--secondary);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #8a6fd6);
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .progress-label { font-size: 13px; color: var(--text-gray); margin-top: 8px; }

  .task-item, .reward-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid #f0eef4;
  }
  .task-item:last-child, .reward-item:last-child { border-bottom: none; }
  .task-info { flex: 1; }
  .task-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .task-instructions { font-size: 13px; color: var(--text-gray); line-height: 1.4; }

  .status-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-pending { color: var(--pending); background: var(--pending-bg); }
  .status-approved { color: var(--approved); background: var(--approved-bg); }
  .status-notstarted { color: var(--notstarted); background: var(--notstarted-bg); }

  .reward-name { font-weight: 600; font-size: 15px; }
  .reward-points { font-size: 13px; color: var(--text-gray); margin-top: 3px; }
  .reward-item.unlocked .reward-name { color: var(--approved); }
  .reward-item.locked { opacity: 0.65; }
  .reward-check { color: var(--approved); font-weight: 800; margin-right: 6px; }

  .empty-state { font-size: 14px; color: var(--text-gray); font-style: italic; padding: 8px 0; }

  .logout-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-gray);
    cursor: pointer;
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .dash-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .dash-header .greeting { text-align: left; }
  }
</style>
</head>

      <div class="greeting">
        <h1 id="greetingText">Hey, there!</h1>
        <p id="studentNameSub"></p>
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-bottom:20px;">
      <a href="https://youthcareerhub.softr.app/" target="_blank" style="flex:1;display:block;padding:14px 10px;background:var(--primary);color:#fff;font-weight:700;font-size:13px;letter-spacing:0.04em;text-align:center;border-radius:12px;text-decoration:none;">VIEW OPEN JOBS</a>
      <a href="https://airtable.com/appEikovLHpe11LB2/pagrsw211DDHq2rGy/form" target="_blank" style="flex:1;display:block;padding:14px 10px;background:#fff;color:var(--primary);font-weight:700;font-size:13px;letter-spacing:0.04em;text-align:center;border-radius:12px;text-decoration:none;border:2px solid var(--primary);">SUBMIT A TASK FOR POINTS</a>
    </div>

    <div id="dashboardSections"></div>

    <div class="logout-link" onclick="handleLogout()">Log out</div>
  </div>
</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const TABLES = {
  students: "Students",
  schools: "Schools",
  tasks: "Tasks",
  submissions: "Submissions",
  rewards: "Rewards",
  config: "Dashboard Config"
};

const REWARD_TIERS = [
  { name: "Snack Pack", points: 100 },
  { name: "ATT Swag", points: 200 },
  { name: "$25 Gift Card", points: 300 },
  { name: "ATT Graduation Cord", points: 400 },
  { name: "$50 Gift Card", points: 500 }
];

const STORAGE_KEY = "att_student_code";

/* ==========================================================
   AIRTABLE HELPERS
   ========================================================== */
async function airtableRequest(params) {
  const query = new URLSearchParams(params).toString();
  const res = await fetch(`/api/airtable?${query}`);
  if (!res.ok) {
    const errBody = await res.text();
    throw new Error(`Airtable error ${res.status}: ${errBody}`);
  }
  return res.json();
}

async function listRecords(table, filterFormula) {
  const params = { table };
  if (filterFormula) params.filterByFormula = filterFormula;
  const data = await airtableRequest(params);
  return data.records || [];
}

async function getRecord(table, id) {
  return airtableRequest({ table, recordId: id });
}

/* ==========================================================
   LOGIN FLOW
   ========================================================== */
async function handleLogin() {
  const input = document.getElementById("accessCodeInput");
  const code = input.value.trim().toUpperCase();
  const btn = document.getElementById("loginBtn");
  const errorBox = document.getElementById("loginError");
  errorBox.style.display = "none";

  if (!code) {
    showLoginError("Please enter your access code.");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Checking...';

  try {
    const formula = `{Login Code} = "${code}"`;
    const records = await listRecords(TABLES.students, formula);

    if (records.length === 0) {
      showLoginError("We couldn't find that code. Double-check it and try again.");
      btn.disabled = false;
      btn.textContent = "VIEW MY PROGRESS";
      return;
    }

    const student = records[0];
    localStorage_set(STORAGE_KEY, code);
    await loadDashboard(student);

  } catch (err) {
    console.error(err);
    showLoginError("Something went wrong connecting to the server. Please try again in a moment.");
    btn.disabled = false;
    btn.textContent = "VIEW MY PROGRESS";
  }
}

function showLoginError(msg) {
  const errorBox = document.getElementById("loginError");
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}

function handleLogout() {
  localStorage_remove(STORAGE_KEY);
  document.getElementById("dashboardView").style.display = "none";
  document.getElementById("loginView").style.display = "flex";
  document.getElementById("accessCodeInput").value = "";
}

// In-memory fallback storage (artifacts/sandboxed contexts may block localStorage)
const memoryStore = {};
function localStorage_set(key, val) {
  try { localStorage.setItem(key, val); } catch (e) { memoryStore[key] = val; }
}
function localStorage_get(key) {
  try { return localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; }
}
function localStorage_remove(key) {
  try { localStorage.removeItem(key); } catch (e) { delete memoryStore[key]; }
}

/* ==========================================================
   DASHBOARD LOAD
   ========================================================== */
async function loadDashboard(student) {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";

  const fields = student.fields;
  const studentName = fields["Student Name"] || "Student";
  const firstName = studentName.split(" ")[0];
  const pointBalance = fields["Point Balance (Live)"] || 0;

  document.getElementById("greetingText").textContent = `Hey, ${firstName}!`;
  document.getElementById("studentNameSub").textContent = studentName;

  // Fetch config
  let config = null;
  try {
    const configRecords = await listRecords(TABLES.config);
    config = configRecords[0] ? configRecords[0].fields : null;
  } catch (e) {
    console.warn("Could not load config, using defaults", e);
  }

  if (config) {
    if (config["Primary Color"]) document.documentElement.style.setProperty('--primary', config["Primary Color"]);
    if (config["Secondary Color"]) document.documentElement.style.setProperty('--secondary', config["Secondary Color"]);
  }

  const showPoints = config ? config["Show Points"] !== false : true;
  const showProgress = config ? config["Show Progress Bar"] !== false : true;
  const showTasks = config ? config["Show Tasks"] !== false : true;
  const showRewards = config ? config["Show Rewards"] !== false : true;
  const pointsLabel = (config && config["Points Label"]) || "My Points";
  const tasksLabel = (config && config["Tasks Label"]) || "My Tasks";
  const rewardsLabel = (config && config["Rewards Label"]) || "Unlock Rewards";
  const progressLabel = (config && config["Progress Label"]) || "Progress to Next Reward";
  const layoutOrder = (config && config["Layout Order"])
    ? config["Layout Order"].split(",").map(s => s.trim())
    : ["points", "progress", "tasks", "rewards"];

  const container = document.getElementById("dashboardSections");
  container.innerHTML = '<div class="empty-state">Loading your dashboard...</div>';

  const sectionHtml = {};

  if (showPoints) {
    sectionHtml.points = renderPointsSection(pointBalance, pointsLabel);
  }
  if (showProgress) {
    sectionHtml.progress = renderProgressSection(pointBalance, progressLabel);
  }
  if (showTasks) {
    sectionHtml.tasks = await renderTasksSection(student, tasksLabel);
  }
  if (showRewards) {
    sectionHtml.rewards = renderRewardsSection(pointBalance, rewardsLabel);
  }

  container.innerHTML = layoutOrder
    .filter(key => sectionHtml[key])
    .map(key => sectionHtml[key])
    .join("");
}

/* ---------- Points ---------- */
function renderPointsSection(points, label) {
  return `
    <div class="card">
      <h3>${escapeHtml(label)}</h3>
      <div><span class="points-value">${points}</span><span class="points-unit">points earned</span></div>
    </div>`;
}

/* ---------- Progress ---------- */
function renderProgressSection(points, label) {
  const nextTier = REWARD_TIERS.find(t => points < t.points);
  const cap = nextTier ? nextTier.points : REWARD_TIERS[REWARD_TIERS.length - 1].points;
  const pct = Math.min(100, Math.round((points / cap) * 100));
  const remainingText = nextTier
    ? `${nextTier.points - points} points to unlock ${nextTier.name}`
    : "All reward tiers unlocked!";
  return `
    <div class="card">
      <h3>${escapeHtml(label)}</h3>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${escapeHtml(remainingText)}</div>
    </div>`;
}

/* ---------- Tasks ---------- */
async function renderTasksSection(student, label) {
  try {
    const availableTasks = await listRecords(TABLES.tasks, `AND({Status} = "Open", {Availability} = "Available")`);

    // Build map of submission recordId -> submission fields for this student's submissions
    const submissionLinks = student.fields["Submissions"] || [];
    const submissionRecords = await Promise.all(
      submissionLinks.map(id => getRecord(TABLES.submissions, id).catch(() => null))
    );
    const validSubmissions = submissionRecords.filter(Boolean);

    // Map taskId -> submission status
    const taskStatusMap = {};
    validSubmissions.forEach(sub => {
      const taskLinks = sub.fields["Task"] || [];
      taskLinks.forEach(taskId => {
        const status = sub.fields["Status"] || "Pending";
        taskStatusMap[taskId] = status;
      });
    });

    if (availableTasks.length === 0) {
      return `<div class="card"><h3>${escapeHtml(label)}</h3><div class="empty-state">No tasks available right now.</div></div>`;
    }

    const taskRows = availableTasks.map(task => {
      const name = task.fields["Task Name"] || "Untitled Task";
      const instructions = task.fields["Instructions"] || "";
      const rawStatus = taskStatusMap[task.id];
      let statusKey, statusText;
      if (!rawStatus) {
        statusKey = "notstarted"; statusText = "Not Started";
      } else if (/approved/i.test(rawStatus)) {
        statusKey = "approved"; statusText = "Approved";
      } else {
        statusKey = "pending"; statusText = "Pending";
      }
      return { name, instructions, statusKey, statusText };
    });

    const order = { pending: 0, approved: 1, notstarted: 2 };
    taskRows.sort((a, b) => order[a.statusKey] - order[b.statusKey]);

    const rowsHtml = taskRows.map(t => `
      <div class="task-item">
        <div class="task-info">
          <div class="task-name">${escapeHtml(t.name)}</div>
          ${t.instructions ? `<div class="task-instructions">${escapeHtml(t.instructions)}</div>` : ""}
        </div>
        <span class="status-badge status-${t.statusKey}">${escapeHtml(t.statusText)}</span>
      </div>
    `).join("");

    return `<div class="card"><h3>${escapeHtml(label)}</h3>${rowsHtml}</div>`;
  } catch (e) {
    console.error("Tasks section error", e);
    return `<div class="card"><h3>${escapeHtml(label)}</h3><div class="empty-state">Couldn't load tasks right now.</div></div>`;
  }
}

/* ---------- Rewards ---------- */
function renderRewardsSection(points, label) {
  const rows = REWARD_TIERS.map(tier => {
    const unlocked = points >= tier.points;
    const remaining = tier.points - points;
    return `
      <div class="reward-item ${unlocked ? 'unlocked' : 'locked'}">
        <div>
          <div class="reward-name">${unlocked ? '<span class="reward-check">&#10003;</span>' : ''}${escapeHtml(tier.name)}</div>
          <div class="reward-points">${unlocked ? 'Unlocked!' : `${remaining} points needed`}</div>
        </div>
      </div>
    `;
  }).join("");
  return `<div class="card"><h3>${escapeHtml(label)}</h3>${rows}</div>`;
}

/* ---------- Utils ---------- */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}


/* ==========================================================
   AUTO LOGIN ON LOAD (if code already stored)
   ========================================================== */
window.addEventListener("DOMContentLoaded", async () => {
  const savedCode = localStorage_get(STORAGE_KEY);
  if (savedCode) {
    try {
      const formula = `{Login Code} = "${savedCode}"`;
      const records = await listRecords(TABLES.students, formula);
      if (records.length > 0) {
        await loadDashboard(records[0]);
        return;
      }
    } catch (e) {
      console.warn("Auto-login failed, showing login screen", e);
    }
  }
});

document.getElementById("accessCodeInput")?.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleLogin();
});
</script>
</body>
</html>
